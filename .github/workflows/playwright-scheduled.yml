# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/playwright-scheduled.yml
#
# Owner : Nitin K M — CI/CD & Execution
# Project: GitHub Playwright Automation — Group 5, IBM QE Training
#
# Purpose
# ───────
# Nightly scheduled run of the full Playwright test suite. Runs at 00:00 UTC
# every day against all three browsers. Results are uploaded as artefacts and
# a summary is written to the GitHub Actions summary page.
# Failures trigger the built-in GitHub notification to repository watchers.
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Nightly

on:
  schedule:
    # Every day at 00:00 UTC  (05:30 IST for the team)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser (chromium | firefox | webkit | all)'
        required: false
        default: 'all'

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:

  # ── Install & cache ──────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.pw-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Node dependencies
        run: npm ci --prefer-offline || npm install

      - name: Read Playwright version
        id: pw-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers + OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install OS browser dependencies (cached binaries)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

  # ── Multi-browser nightly run ────────────────────────────────────────────────
  nightly-test:
    name: Nightly — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: install

    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]

    if: |
      github.event_name == 'schedule' ||
      inputs.browser == 'all' ||
      inputs.browser == matrix.browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ needs.install.outputs.playwright-version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install OS browser dependencies (from cache)
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Create .env from GitHub Secrets
        env:
          GITHUB_USERNAME_SECRET: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_PASSWORD_SECRET: ${{ secrets.GITHUB_PASSWORD }}
          GITHUB_TOKEN_SECRET:    ${{ secrets.GH_TOKEN }}
        run: |
          cat > .env <<'EOF'
          BASE_URL=https://github.com
          HEADLESS=true
          TIMEOUT=30000
          EOF
          printf 'GITHUB_USERNAME=%s\n' "$GITHUB_USERNAME_SECRET" >> .env
          printf 'GITHUB_PASSWORD=%s\n' "$GITHUB_PASSWORD_SECRET" >> .env
          printf 'GITHUB_TOKEN=%s\n'    "$GITHUB_TOKEN_SECRET"    >> .env

      - name: Run nightly Playwright tests (${{ matrix.browser }})
        env:
          CI: 'true'
          HEADLESS: 'true'
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --reporter=html,list \
            --output=test-results/${{ matrix.browser }}

      - name: Upload HTML report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report-${{ matrix.browser }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results & traces (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results-${{ matrix.browser }}-${{ github.run_number }}
          path: test-results/
          retention-days: 30

  # ── Nightly summary ──────────────────────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: nightly-test
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "## 🌙 Playwright Nightly Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date (UTC):** $(date -u '+%Y-%m-%d %H:%M')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Browser | Artefact |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          for browser in chromium firefox webkit; do
            echo "| $browser | \`nightly-report-$browser-${{ github.run_number }}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
